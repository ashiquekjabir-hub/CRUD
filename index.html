<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center text-primary">
            Product Inventory CRUD
        </h1>


        <!-- PRODUCT FORM -->
        <form id="userform">

            <div class="row my-5">
                <input type="hidden" id="editStatus" value="">
                <!-- Product ID -->
                <div class="col-lg-3">
                    <input id="pid" class="form-control" type="text" placeholder="Product ID">
                </div>


                <!-- Product Name -->
                <div class="col-lg-3">
                    <input id="pname" class="form-control" type="text" placeholder="Product Name">
                </div>


                <!-- Category -->
                <div class="col-lg-3">

                    <select class="form-control" id="category">

                        <option value="" hidden>
                            Select Category
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                    </select>

                </div>


                <!-- Price -->
                <div class="col-lg-3">

                    <input id="price" class="form-control" type="text" placeholder="Price">

                </div>


                <!-- Quantity -->
                <div class="col-lg-3 mt-3">

                    <input id="pquant" class="form-control" type="text" placeholder="Quantity">

                </div>


                <!-- Add Button -->
                <div class="col-lg-3 mt-3">

                    <button type="submit" class="btn btn-success w-100">

                        Add Product

                    </button>

                </div>

            </div>

        </form>

        <div class="row my-5">

            <!-- Search -->
            <div class="col-lg-6">

                <input id="psearch" class="form-control" type="text" placeholder="Search product name">

            </div>


            <!-- Category Filter -->
            <div class="col-lg-6">

                <select class="form-control" id="categoryFilter">

                    <option value="">
                        Filter Category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Clothing">
                        Clothing
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>

        </div>


        <!-- PRODUCT TABLE -->

        <table class="my-5 table table-bordered table-hover">

            <thead class="table-dark text-light text-center">

                <tr>

                    <th>#</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="tablebody">

            </tbody>

        </table>

    </div>


    <script src="./main.js"></script>

</body>

</html>
